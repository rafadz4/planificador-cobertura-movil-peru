[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coverage-planner-peru"
version = "1.0.0"
description = "Planificador territorial de cobertura móvil con datos de OSIPTEL"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Rafael Elias"}]
dependencies = [
  "pandas>=3.0,<4",
  "numpy>=2.4,<3",
  "openpyxl>=3.1,<4",
  "geopandas>=1.1,<2",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "duckdb>=1.4,<2",
  "pyarrow>=23,<26",
  "streamlit>=1.50,<2",
  "plotly>=6.5,<7",
  "pydeck>=0.9,<1",
  "ortools>=9.14,<10",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

